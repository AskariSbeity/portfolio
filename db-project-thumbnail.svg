<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#000000"/>

  <!-- connecting lines -->
  <g stroke="#4b4b4b" stroke-width="1.5" fill="none">
    <line x1="150" y1="95" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="300" y2="200"/>
    <line x1="450" y1="95" x2="450" y2="150"/>
    <line x1="450" y1="150" x2="300" y2="200"/>
    <line x1="150" y1="305" x2="150" y2="250"/>
    <line x1="150" y1="250" x2="300" y2="200"/>
    <line x1="450" y1="305" x2="450" y2="250"/>
    <line x1="450" y1="250" x2="300" y2="200"/>
  </g>

  <!-- relationship diamond -->
  <g>
    <rect x="278" y="178" width="44" height="44" fill="#000000" stroke="#ffffff" stroke-width="1.5" transform="rotate(45 300 200)"/>
  </g>

  <!-- entity boxes -->
  <g fill="#0d0d0d" stroke="#ffffff" stroke-width="1.5">
    <rect x="80" y="55" width="140" height="40" rx="6"/>
    <rect x="380" y="55" width="140" height="40" rx="6"/>
    <rect x="80" y="265" width="140" height="40" rx="6"/>
    <rect x="380" y="265" width="140" height="40" rx="6"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="150" y="79">Customer</text>
    <text x="450" y="79">Branch</text>
    <text x="150" y="289">Orders</text>
    <text x="450" y="289">MenuItem</text>
  </g>

  <!-- key attribute pills -->
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#9ca3af">
    <circle cx="70" cy="40" r="3" fill="#ffffff"/>
    <text x="80" y="44">Customer_ID (PK)</text>

    <circle cx="370" cy="40" r="3" fill="#ffffff"/>
    <text x="380" y="44">Branch_ID (PK)</text>

    <circle cx="70" cy="335" r="3" fill="#ffffff"/>
    <text x="80" y="339">Order_ID (PK)</text>

    <circle cx="370" cy="335" r="3" fill="#ffffff"/>
    <text x="380" y="339">Item_ID (PK)</text>
  </g>

  <!-- corner label -->
  <text x="30" y="370" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6b7280">ENTITY-RELATIONSHIP MODEL</text>
</svg>
