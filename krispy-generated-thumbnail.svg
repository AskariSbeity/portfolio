<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#000000"/>

  <!-- browser frame -->
  <rect x="60" y="55" width="480" height="290" rx="14" fill="#0d0d0d" stroke="#ffffff" stroke-width="1.5"/>

  <!-- nav bar -->
  <text x="90" y="95" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#ffffff">KRISPY TENDER</text>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#9ca3af" letter-spacing="1">
    <text x="390" y="94">MENU</text>
    <text x="450" y="94">ORDER</text>
  </g>
  <line x1="90" y1="112" x2="510" y2="112" stroke="#2a2a2a" stroke-width="1"/>

  <!-- section label -->
  <text x="90" y="140" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6b7280">TODAY'S MENU</text>

  <!-- menu item cards -->
  <g>
    <rect x="90" y="155" width="122" height="140" rx="10" fill="#000000" stroke="#4b4b4b" stroke-width="1.2"/>
    <circle cx="151" cy="205" r="26" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M139 205a12 12 0 0 1 24 0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="151" y="255" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Tender Box</text>
    <text x="151" y="275" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">$8.90</text>
  </g>

  <g>
    <rect x="224" y="155" width="122" height="140" rx="10" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="285" cy="205" r="26" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M273 205a12 12 0 0 1 24 0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="285" y="255" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Crispy Combo</text>
    <text x="285" y="275" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">$11.50</text>
    <rect x="252" y="163" width="66" height="20" rx="10" fill="#ffffff"/>
    <text x="285" y="177" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.5">POPULAR</text>
  </g>

  <g>
    <rect x="358" y="155" width="122" height="140" rx="10" fill="#000000" stroke="#4b4b4b" stroke-width="1.2"/>
    <circle cx="419" cy="205" r="26" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M407 205a12 12 0 0 1 24 0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="419" y="255" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Spicy Wings</text>
    <text x="419" y="275" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">$9.90</text>
  </g>

  <!-- CTA -->
  <rect x="220" y="310" width="160" height="26" rx="13" fill="#ffffff"/>
  <text x="300" y="327" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="1">ORDER NOW</text>

  <!-- corner label -->
  <text x="30" y="380" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6b7280">RESTAURANT ORDERING WEBSITE</text>
