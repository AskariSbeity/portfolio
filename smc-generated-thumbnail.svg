  <rect x="422" y="80" width="88" height="24" rx="12" fill="#ffffff"/>
  <text x="466" y="96" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.5">BOOK VISIT</text>
  <line x1="90" y1="114" x2="510" y2="114" stroke="#2a2a2a" stroke-width="1"/>

  <!-- section label -->
