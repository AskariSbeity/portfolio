      <circle cx="133" cy="182" r="11" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="133" y="215">Neurology</text>
    </g>
    <g>
      <rect x="188" y="155" width="86" height="72" rx="10" fill="#000000" stroke="#4b4b4b" stroke-width="1.2"/>
      <circle cx="231" cy="182" r="11" fill="none" stroke="#ffffff" stroke-width="1.5"/>
