<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#000000"/>

  <!-- connection line -->
  <line x1="185" y1="200" x2="415" y2="200" stroke="#4b4b4b" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- packet chips traveling along the line -->
  <g fill="#ffffff">
    <rect x="235" y="193" width="26" height="14" rx="3" opacity="0.9"/>
    <rect x="300" y="193" width="26" height="14" rx="3" opacity="0.55"/>
    <rect x="365" y="193" width="26" height="14" rx="3" opacity="0.25"/>
  </g>

  <!-- client node -->
  <g>
    <rect x="90" y="150" width="95" height="100" rx="8" fill="#0d0d0d" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="105" y="165" width="65" height="45" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <line x1="112" y1="176" x2="150" y2="176" stroke="#9ca3af" stroke-width="1.2"/>
    <line x1="112" y1="185" x2="160" y2="185" stroke="#9ca3af" stroke-width="1.2"/>
    <line x1="112" y1="194" x2="140" y2="194" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="130" y="222" width="25" height="6" rx="2" fill="#9ca3af"/>
  </g>

  <!-- server node -->
  <g>
    <rect x="415" y="140" width="95" height="120" rx="8" fill="#0d0d0d" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="428" y="155" width="69" height="18" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="428" y="180" width="69" height="18" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="428" y="205" width="69" height="18" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <circle cx="436" cy="164" r="2.5" fill="#ffffff"/>
    <circle cx="436" cy="189" r="2.5" fill="#ffffff"/>
    <circle cx="436" cy="214" r="2.5" fill="#ffffff"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="137" y="280">Client</text>
    <text x="462" y="295">Server :12000</text>
  </g>

  <text x="300" y="188" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#9ca3af" text-anchor="middle">TCP</text>

  <text x="30" y="370" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6b7280">SOCKET PROGRAMMING</text>
</svg>
